<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop - Online Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
            color: #222;
        }
        header {
            background: #173b70;
            color: white;
            padding: 22px;
            text-align: center;
        }
        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
        }
        .product {
            padding: 14px;
            margin: 10px 0;
            background: #eef4ff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>MyShop</h1>
        <p>Your Demo Online Store</p>
    </header>

    <main>
        <h2>Our Products</h2>

        <div class="product">
            <h3>Laptop</h3>
            <p>Price: ₹45,999</p>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>Price: ₹2,499</p>
        </div>

        <div class="product">
            <h3>Smart Watch</h3>
            <p>Price: ₹5,999</p>
        </div>

        <a href="/checkout">Checkout</a>
        <p>CyberMesh demo website for security testing.</p>
    </main>
</body>
</html>
